      - independent_n_gold
      - allocation_gold
      - biological_independence_gold
      - pseudoreplication_verdict_gold
      - interference_gold
      - estimand_gold
    public_note: >
      Planned training dataset for an NLP checker assessing explicit reporting
      of the experimental unit under ARRIVE Essential 10 item 1b. It is not
      assumed to encode the underlying experimental structure. NC3Rs is not
      claimed as a partner, approver or endorser of N-Truth. Default use is
      reporting/evidence extraction only.
    next_action:
      - await_release
      - inspect_annotation_schema
      - inspect_licence
      - evaluate_task_compatibility
