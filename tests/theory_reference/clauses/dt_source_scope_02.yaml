# Theory Reference Entry - mai generato dall'output del Rulebook (PRD §10.9).
theory_reference_entry:
  entry_id: TR-DT-SOURCE-SCOPE-02-001
  clause_id: DT-SOURCE-SCOPE-02
  family: G
  status: SCIENTIFIC_REVIEW_REQUIRED
  source_basis:
    - "PRD v8.0 §7.15 G"
    - "PRD v8.0 §2.6 (portata dell'inferenza)"
    - "PRD v8.0 Appendice A (coverage_basis)"
  expected_behavior:
    positive: >
      L'inference scope deriva dalla combinazione di query, source diversity,
      protocol, external replication, exposure/interference e profile coverage;
      fonti multiple confermate e protocollo adeguato allargano lo scope.
    negative: >
      L'inference scope non viene inferito dalla sola numerosita': molti
      pozzetti/cellule da un'unica fonte o linea non generalizzano a piu' fonti
      o linee; lo scope resta limitato anche con n alto.
    minimal_counterfactual: >
      Due record con identico n: nel primo le unita provengono da una sola
      fonte/linea, nel secondo da tre fonti distinte confermate. L'inference
      scope e il source-diversity finding devono differire pur essendo n uguale.
