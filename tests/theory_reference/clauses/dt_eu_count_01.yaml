# Theory Reference Entry - mai generato dall'output del Rulebook (PRD §10.9).
theory_reference_entry:
  entry_id: TR-DT-EU-COUNT-01-001
  clause_id: DT-EU-COUNT-01
  family: C
  status: SCIENTIFIC_REVIEW_REQUIRED
  source_basis:
    - "PRD v8.0 §7.15 C"
    - "PRD v8.0 §7.9 (Canonical Count Registry)"
    - "PRD v8.0 §7.11 (attrition ed esclusioni)"
    - "PRD v8.0 Appendice N (righe source/EU)"
  expected_behavior:
    positive: >
      L'experimental-unit count e' il numero di istanze distinte dell'EU nello
      scope del contrasto e del lifecycle pertinente, per gruppo o paired set;
      le esclusioni aggiornano il count gerarchicamente nel lifecycle.
    negative: >
      Repeated measures, cellule, campi, immagini e analytical rows non
      moltiplicano l'EU count; un numero dichiarato globale quando esistono
      piu' scope non e' un count accettabile senza scomposizione per gruppo,
      contrasto ed endpoint.
    minimal_counterfactual: >
      Due record identici salvo l'aggiunta di unita: nel primo vengono aggiunti
      campi/immagini sullo stesso soggetto, nel secondo viene aggiunto un
      soggetto distinto con assegnazione separabile. Il count dell'EU deve
      cambiare solo nel secondo caso.
