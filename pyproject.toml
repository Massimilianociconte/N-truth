[project]
name = "ntruth"
version = "0.1.0"
description = "Sistema locale e verificabile per ricostruire unita sperimentali, gerarchie di replicazione e valore indipendente di n negli esperimenti biologici"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Massimiliano Ciconte" }]
keywords = ["pseudoreplication", "experimental-unit", "reproducibility", "knowledge-graph"]

# Core deterministico: nessuna dipendenza ML, nessuna rete.
dependencies = [
    "pydantic>=2.9",
    "networkx>=3.3",
    "typer>=0.12",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "polars>=1.0",
    "pypdf>=5.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# Il backend ML e intenzionalmente opzionale e disponibile solo su Apple Silicon.
# Il core, la CI Linux e le analisi deterministiche non importano queste dipendenze.
ml = [
    "mlx-lm[train]==0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=1.0,<2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx>=3.3",
    "types-openpyxl>=3.1",
    "fastapi>=0.115",
    "httpx2>=2.7",
]

[project.urls]
Homepage = "https://github.com/Massimilianociconte/N-truth"
Repository = "https://github.com/Massimilianociconte/N-truth.git"
Issues = "https://github.com/Massimilianociconte/N-truth/issues"
Documentation = "https://github.com/Massimilianociconte/N-truth/tree/main/docs"

[project.scripts]
ntruth = "ntruth.cli.main:app"
ntruth-api = "ntruth.api.main:run"
ntruth-ml = "ntruth.training.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/ntruth"]

[tool.hatch.build.targets.wheel.force-include]
"rulesets" = "ntruth/_bundled/rulesets"
"ontology" = "ntruth/_bundled/ontology"
"apps/desktop/dist" = "ntruth/_ui"
"models/configs/qwen3-4b-instruct-2507-mlx-qlora.json" = "ntruth/_bundled/models/qwen3-4b-instruct-2507-mlx-qlora.json"

[tool.hatch.build.targets.sdist.force-include]
# Il wheel viene ricostruito dalla sdist: gli asset compilati devono attraversare
# entrambi i passaggi, pur restando ignorati nel worktree.
"apps/desktop/dist" = "apps/desktop/dist"

[tool.hatch.build.targets.sdist]
# Una sdist deve essere ricostruibile, ma non deve mai incorporare workspace,
# dataset, cache locali o artefatti prodotti durante test e addestramento.
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "/.hypothesis",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/dist",
    "/local-data",
    "/workspace",
    "/data/raw",
    "/data/external",
    "/data/processed",
    "/models/checkpoints",
    "/models/runs",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
addopts = "-q --strict-markers"
markers = [
    "scientific: fixture sintetica normativa; non gold adjudicato (PRD 22.3)",
    "security: input ostile (PRD NFR-13)",
    "regression: bug scientifico congelato (PRD 22.3)",
    "performance: budget locale tempo/memoria (PRD NFR-06/NFR-07)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer dichiara le opzioni nei default degli argomenti: e l'idioma della libreria.
"packages/ntruth/cli/main.py" = ["B008"]
"packages/ntruth/training/cli.py" = ["B008"]
# I pattern linguistici usano intervalli Unicode e separatori tipografici reali
# (EN DASH negli intervalli numerici, NBSP come separatore delle migliaia).
"packages/ntruth/extract/numbers.py" = ["RUF001"]
"packages/ntruth/extract/text_extract.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["ntruth"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "huggingface_hub.*",
    "mlx_lm",
    "mlx_lm.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
