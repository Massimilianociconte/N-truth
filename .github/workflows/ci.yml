name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build and test local UI
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Rebuild locked environment
        run: uv sync --extra dev --extra api --locked
      - name: Verify lockfile is up to date
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages
      - name: PRD v8 examples, schema and architecture truth
        run: uv run python scripts/check_prd_v8_contracts.py
      - name: Normative examples registry check (PRD v9 §26.5)
        run: uv run python scripts/check_normative_examples.py
      - name: V6 split and facsimile invariant gate
        run: uv run pytest -m invariant --disable-warnings
      - name: Tests
        run: uv run pytest --disable-warnings
      - name: ML CLI contract smoke (no model download)
        run: uv run ntruth-ml --help
      - name: Enforce tracked-tree NO_CORPUS privacy secret and size policy
        run: uv run python scripts/check_repository_policy.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify packaged UI and scientific assets
        run: uv run python scripts/check_distribution.py
      - name: Smoke-test wheel and sdist in clean locked environments
        run: uv run python scripts/smoke_release.py
      - name: Smoke-test optional ML extra without model download
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            uv run python scripts/smoke_release.py --include-ml
          else
            echo "MLX extra skipped: runner is not arm64"
          fi
      - name: Verify SBOM is reproducible from the lockfile
        run: |
          uv run python scripts/generate_sbom.py --check sbom.cdx.json

  linux-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0
      - run: uv sync --extra dev --extra api --locked
      - name: PRD v8 examples, schema and architecture truth
        run: uv run python scripts/check_prd_v8_contracts.py
      - name: Normative examples registry check (PRD v9 §26.5)
        run: uv run python scripts/check_normative_examples.py
      - name: V6 split and facsimile invariant gate
        run: uv run pytest -m invariant --disable-warnings
      - run: uv run pytest -m "not performance"
