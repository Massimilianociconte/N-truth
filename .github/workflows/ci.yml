name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build and test local UI
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Rebuild locked environment
        run: uv sync --extra dev --extra api --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages
      - name: Tests
        run: uv run pytest --disable-warnings
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify packaged UI and scientific assets
        run: uv run python scripts/check_distribution.py
      - name: Smoke-test wheel and sdist offline in clean environments
        run: uv run python scripts/smoke_release.py
      - name: Verify SBOM is reproducible from the lockfile
        run: |
          uv run python scripts/generate_sbom.py --check sbom.cdx.json

  linux-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra api --locked
      - run: uv run pytest -m "not performance"
