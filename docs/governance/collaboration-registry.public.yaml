notes: >
  This file records scientific contacts and engagement status only.
  It must not contain email addresses, phone numbers, private correspondence,
  or language that implies formal partnership or endorsement unless a written
  agreement exists. Private contact details and correspondence metadata live
  outside Git under the local private registry path.

